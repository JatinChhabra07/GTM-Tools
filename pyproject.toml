[project]
name = "gtm-tools"
version = "0.1.0"
description = "Signal-based cold outreach automation: Python gtm CLI + Claude Code skills (see plan.md)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "cryptography>=42",
    "httpx>=0.27",
    "mem0ai[nlp]==2.2.1",
    # hybrid search: mem0 adds BM25 keyword matching when these are present (exact product terms)
    "fastembed>=0.5",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "apify-client>=1.8",
    "mcp>=1.2",
    "dnspython>=2.6",
]

[project.scripts]
gtm = "gtm.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

# CPU-only torch: the embedder is small and the GPU build is ~2 GB of CUDA we never use
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the pinned spaCy model wheel

[tool.hatch.build.targets.wheel]
packages = ["gtm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs the real claude CLI / network (opt-in via GTM_LIVE_TESTS=1)",
]
