[project]
name = "gtm-tools"
version = "0.1.0"
description = "Signal-based cold outreach automation: Python gtm CLI + Claude Code skills (see plan.md)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "cryptography>=42",
    "httpx>=0.27",
]

[project.scripts]
gtm = "gtm.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gtm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs the real claude CLI / network (opt-in via GTM_LIVE_TESTS=1)",
]
